name: E2E onboarding tests

# release/** is included to match ci-check: these are the only jobs that build a
# production Chrome artifact, so the manifest CSP and the nonce wiring that goes
# with it are exercised nowhere else.
on:
  push:
    branches: [ master, develop, release/** ]
  pull_request:
    branches: [ master, develop, release/** ]

permissions:
  contents: read

jobs:
  e2e-onboarding-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Run approved dependency install scripts (.npmrc sets ignore-scripts=true)
      # and fail the build if a dependency ships an install script not in the
      # `lavamoat.allowScripts` allowlist — same supply-chain gate as ci-check.
      - name: Allow approved install scripts
        run: npm run allow-scripts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Chrome tests
        run: npm run e2e:chrome:headless:onboarding

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30