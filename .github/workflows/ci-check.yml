name: CI Check

on:
  push:
    branches: [ master, develop, release/** ]
  pull_request:
    branches: [ master, develop, release/** ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Cache npm dependencies
      id: cache-npm
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install & Check
      run: |
        npm ci
        # Run approved dependency install scripts (.npmrc sets ignore-scripts=true).
        # Builds the unrs-resolver native binding needed by eslint/jest, and fails
        # the build if a dependency ships an install script not in the
        # `lavamoat.allowScripts` allowlist.
        npm run allow-scripts
        npm run ci-check

    # Blocking: custom wallet rules (.semgrep.yml) + security-focused registry
    # packs, plus the casper-js-sdk version parity check. Pinned to the semgrep
    # version the config was validated against (see .semgrep/README.md).
    - name: Semgrep (blocking)
      run: |
        pipx install semgrep==1.157.0
        npm run semgrep:ci

    # Blocking: fail the build on a high+ vulnerability that reaches the
    # shipped bundle (runtime deps only).
    - name: Audit runtime dependencies (blocking)
      run: npm run audit:ci

    # Non-blocking: surface dev/build-toolchain advisories for visibility
    # without failing CI (these never reach the extension bundle).
    - name: Audit full dependency tree (non-blocking)
      run: npm audit || true
