# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # One combined PR for all minor+patch bumps; majors stay individual
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Wait out the window in which compromised releases are typically
    # detected and yanked. Security updates from Dependabot alerts bypass this.
    cooldown:
      default-days: 7
      semver-major-days: 14
    target-branch: "develop"
    # Specify labels for npm pull requests
    labels:
      - "dependencies"
    # Add reviewers
    reviewers:
      - "Comp0te"
    ignore:
      # @types/node must track the Node runtime we build and run on, which is 22
      # everywhere (.nvmrc, engines.node, CI node-version). Bump it with the Node
      # upgrade, not ahead of it — otherwise code typechecks against APIs that are
      # not there at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
